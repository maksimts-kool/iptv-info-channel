services:
  m3u-info:
    build: .
    container_name: m3u-playlist-info
    restart: unless-stopped
    ports:
      - "${PORT:-9222}:${PORT:-9222}"
    # Grouped to mirror .env.example. Each var falls back to its default, so an
    # empty .env still boots. Override by exporting the var or editing .env.
    environment:
      # --- 1. Networking & access ---
      PORT: ${PORT:-9222}
      TZ: ${TZ:-Europe/Tallinn}
      # IMPORTANT: the address clients use to reach the server. For LAN IPTV
      # players use the host machine IP, e.g. http://192.168.1.50:9222 — never
      # localhost. Off-LAN use an https:// origin (the token travels in the URL).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9222}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-to-a-long-random-string}
      # Set to 1 behind a reverse proxy (nginx / DO LB) so the rate limiters see
      # real client IPs. Leave unset on a directly-exposed port.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # --- 2. Channel catalog (the customer playlist) ---
      # Provider playlists themselves are added in the admin, not here.
      CATALOG_FETCH_TIMEOUT_MS: ${CATALOG_FETCH_TIMEOUT_MS:-30000}
      CATALOG_MAX_BYTES: ${CATALOG_MAX_BYTES:-33554432}
      # Master switch; the per-source interval is set in the admin.
      CATALOG_AUTO_REFRESH: ${CATALOG_AUTO_REFRESH:-true}
      CATALOG_REFRESH_CHECK_MINUTES: ${CATALOG_REFRESH_CHECK_MINUTES:-5}
      CATALOG_REFRESH_INTERVAL_HOURS: ${CATALOG_REFRESH_INTERVAL_HOURS:-24}
      INFO_CATEGORY_NAME: ${INFO_CATEGORY_NAME:-Информация}
      # --- 3. Info channel look & timing ---
      # 720p + low frame rates look identical on a TV but cost far less CPU.
      CHANNEL_WIDTH: ${CHANNEL_WIDTH:-1280}
      CHANNEL_HEIGHT: ${CHANNEL_HEIGHT:-720}
      CHANNEL_FPS: ${CHANNEL_FPS:-12}
      CHANNEL_STILL_FPS: ${CHANNEL_STILL_FPS:-4}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-ultrafast}
      HLS_TIME: ${HLS_TIME:-6}
      ACCOUNT_SLIDE_SECONDS: ${ACCOUNT_SLIDE_SECONDS:-120}
      CHANNEL_LIVE_LOOP: ${CHANNEL_LIVE_LOOP:-true}
      EXPIRING_THRESHOLD_DAYS: ${EXPIRING_THRESHOLD_DAYS:-7}
      SLIDE_TIMER_ENABLED: ${SLIDE_TIMER_ENABLED:-true}
      TIMER_FONT_FILE: ${TIMER_FONT_FILE:-}
      INTRO_ENABLED: ${INTRO_ENABLED:-true}
      INTRO_SLIDE_SECONDS: ${INTRO_SLIDE_SECONDS:-4}
      INTRO_TRANSITION: ${INTRO_TRANSITION:-slideleft}
      # --- 4. Global slides ---
      STATUS_SLIDE_ENABLED: ${STATUS_SLIDE_ENABLED:-true}
      STATUS_SLIDE_SECONDS: ${STATUS_SLIDE_SECONDS:-12}
      # --- 5. EPG / programme guide ---
      EPG_ENABLED: ${EPG_ENABLED:-true}
      EPG_DAYS_AHEAD: ${EPG_DAYS_AHEAD:-7}
      EPG_DAYS_BEHIND: ${EPG_DAYS_BEHIND:-1}
      EPG_FOSS_ENABLED: ${EPG_FOSS_ENABLED:-true}
      EPG_FOSS_PROVIDER_ID: ${EPG_FOSS_PROVIDER_ID:-infochannel}
      EPG_FOSS_UPSTREAM_MATCH_URL: ${EPG_FOSS_UPSTREAM_MATCH_URL:-https://ottp.eu.org}
      # --- 6. Email notifications ---
      # DigitalOcean blocks SMTP, so mail goes over a third-party HTTP email API
      # (HTTPS:443). NOTIFY_DRY_RUN=true logs instead of sending.
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-false}
      NOTIFY_PROVIDER: ${NOTIFY_PROVIDER:-brevo}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_FROM_NAME: ${NOTIFY_FROM_NAME:-IPTV Info Channel}
      NOTIFY_DRY_RUN: ${NOTIFY_DRY_RUN:-false}
      # --- 7. Storage & assets (container paths — do not point outside the volume) ---
      DATA_DIR: /app/data
      MUSIC_FILE: assets/music/background.mp3
    volumes:
      # Persist database + generated HLS across restarts. The container runs as
      # the non-root `node` user (uid 1000); if this bind-mounted dir isn't
      # writable by uid 1000, run `sudo chown -R 1000:1000 ./data` once (or use a
      # named volume, which inherits the correct owner automatically).
      - ./data:/app/data

  # Run the test suite inside the image (Docker is the documented test path):
  #   docker compose --profile test run --rm test
  # profiles: ["test"] keeps it out of a normal `docker compose up`.
  test:
    build: .
    profiles: ["test"]
    environment:
      TZ: Europe/Tallinn
      NOTIFY_DRY_RUN: "true"
    command: ["npm", "test"]
