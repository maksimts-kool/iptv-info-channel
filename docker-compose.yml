services:
  m3u-info:
    build: .
    container_name: m3u-playlist-info
    restart: unless-stopped
    ports:
      - "${PORT:-9222}:${PORT:-9222}"
    environment:
      # Override the .env values for the container here if you like.
      PORT: ${PORT:-9222}
      TZ: ${TZ:-Europe/Tallinn}
      # IMPORTANT: set this to the address clients use to reach the server.
      # For LAN IPTV players use the host machine IP, e.g. http://192.168.1.50:9222
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9222}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-to-a-long-random-string}
      # Set to 1 if you run behind a reverse proxy (nginx / DO LB) so the /sub
      # rate limiter sees real client IPs. Leave unset on a directly-exposed port.
      TRUST_PROXY: ${TRUST_PROXY:-}
      ACCOUNT_SLIDE_SECONDS: ${ACCOUNT_SLIDE_SECONDS:-120}
      # The card is a static image; 720p + low frame rates look identical on a
      # TV but cost far less CPU to encode on a small host.
      CHANNEL_WIDTH: ${CHANNEL_WIDTH:-1280}
      CHANNEL_HEIGHT: ${CHANNEL_HEIGHT:-720}
      CHANNEL_FPS: ${CHANNEL_FPS:-30}
      CHANNEL_STILL_FPS: ${CHANNEL_STILL_FPS:-4}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-ultrafast}
      CHANNEL_LIVE_LOOP: ${CHANNEL_LIVE_LOOP:-true}
      EXPIRING_THRESHOLD_DAYS: ${EXPIRING_THRESHOLD_DAYS:-7}
      INTRO_ENABLED: ${INTRO_ENABLED:-true}
      INTRO_SLIDE_SECONDS: ${INTRO_SLIDE_SECONDS:-4}
      INTRO_TRANSITION: ${INTRO_TRANSITION:-slideleft}
      # Global status board slide.
      STATUS_SLIDE_ENABLED: ${STATUS_SLIDE_ENABLED:-true}
      STATUS_SLIDE_SECONDS: ${STATUS_SLIDE_SECONDS:-12}
      # Global World Cup 2026 bracket slide. Enable to add the football frame.
      WORLDCUP_SLIDE_ENABLED: ${WORLDCUP_SLIDE_ENABLED:-false}
      WORLDCUP_SLIDE_SECONDS: ${WORLDCUP_SLIDE_SECONDS:-14}
      FOOTBALL_API_TOKEN: ${FOOTBALL_API_TOKEN:-}
      FOOTBALL_API_BASE: ${FOOTBALL_API_BASE:-https://api.football-data.org/v4}
      FOOTBALL_API_COMPETITION: ${FOOTBALL_API_COMPETITION:-WC}
      FOOTBALL_API_TTL_MINUTES: ${FOOTBALL_API_TTL_MINUTES:-360}
      # ---- Email notifications (intro-slide QR -> /sub/:token sign-up) ----
      # DigitalOcean blocks SMTP ports, so mail goes over a third-party HTTP
      # email API (HTTPS:443). NOTIFY_DRY_RUN=true logs instead of sending.
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-false}
      NOTIFY_PROVIDER: ${NOTIFY_PROVIDER:-brevo}
      NOTIFY_API_KEY: ${NOTIFY_API_KEY:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_FROM_NAME: ${NOTIFY_FROM_NAME:-IPTV Info Channel}
      NOTIFY_DRY_RUN: ${NOTIFY_DRY_RUN:-false}
      DATA_DIR: /app/data
      MUSIC_FILE: assets/music/background.mp3
    volumes:
      # Persist database + generated HLS across restarts.
      - ./data:/app/data
